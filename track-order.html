<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — Oven Diaries</title>
  <meta name="description" content="Track your Oven Diaries order by order ID and leave a review once it has been delivered.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/track-order.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23d9a05b'/%3E%3Ctext x='50' y='68' font-size='48' font-family='Georgia' font-weight='bold' fill='white' text-anchor='middle'%3EOD%3C/text%3E%3C/svg%3E">
</head>
<body>

  <header id="site-header"></header>

  <!-- ============ PAGE HERO ============ -->
  <section class="page-hero">
    <div class="container">
      <h1>Track <span class="accent">Your Order</span></h1>
      <p>Enter the order ID from your receipt to see the live status of your order.</p>
      <div class="crumbs" id="crumbs"></div>
    </div>
  </section>

  <!-- ============ TRACKING ============ -->
  <section>
    <div class="container">
      <div class="track-box">
        <div class="track-search">
          <i class="fa-solid fa-magnifying-glass" style="color:var(--text-light)"></i>
          <input id="track-input" placeholder="Order ID — e.g. OD-1842" maxlength="20" aria-label="Order ID">
          <button class="btn btn-primary" id="track-btn"><i class="fa-solid fa-magnifying-glass"></i> Track Order</button>
        </div>
      </div>

      <div id="track-result" style="display:none"></div>
    </div>
  </section>

  <!-- ============ REVIEWS (visible when the order is delivered) ============ -->
  <section id="review-section" class="review-section" style="display:none">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Reviews</span>
        <h2>Rate your <span class="accent">experience</span></h2>
        <p>Order <b id="review-order" style="color:var(--caramel-dark)">—</b> has been delivered — tell us how it went!</p>
      </div>

      <div class="review-card">
        <form id="review-form">
          <div class="field"><label>Your name *</label><input id="rev-name" maxlength="60" placeholder="Full name"></div>
          <div class="field">
            <label>Your rating *</label>
            <div class="star-pick" id="star-pick"></div>
          </div>
          <div class="field"><label>Your review</label><textarea id="rev-text" rows="4" placeholder="How was the cake? The delivery? Our team?"></textarea></div>
          <div>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-paper-plane"></i> Submit Review</button>
          </div>
        </form>
      </div>

      <h3 style="margin:44px 0 14px;color:var(--choco)">Customer reviews <span class="rev-count" id="review-count">0</span></h3>
      <div class="review-list" id="reviews-body"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/track-order.js"></script>
</body>
</html>
